<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>タスク一覧</title>
</head>
<body class="bg-light">
    <h1 class="h3 mb-4">タスク管理</h1>
    <div class="container py-4" style="max-width: 900px;">

    <!--検索欄-->
    <form class="row g-2 mb-3" th:action="@{/pointSearch}" th:object="${keyword}" method="post">
        検索欄
        <div class="col" th:if="${#fields.hasErrors('keyword')}" th:errors="*{keyword}"></div>
        <input class="form-control" type="text" th:field="*{keyword}">
        <div class="col-auto">
            <button class="btn btn-outline-primary" type="submit">検索</button>
        </div>
    </form>
    <!--ページネーション：前へ/次へ-->
    <div th:if="${totalPages != null}">
        <a th:if="${page > 1}" th:href="@{/task(page=${page - 1})}">前へ</a>
        <span th:if="${page <= 1}">前へ</span>

        <span th:text="${page} + '/' + ${totalPages}"></span>

        <a th:if="${page < totalPages}" th:href="@{/task(page=${page + 1})}">次へ</a>
        <span th:if="${page >= totalPages}">次へ</span>
    </div>

    <!--一覧表示-->
    <table class="table table-dark table-striped-columns">
            <tr>
                <th>タイトル</th>
                <th>達成状況</th>
                <th>作成日</th>
                <th>更新日</th>
            </tr>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.title}"></td>
                <td th:text="${task.completed} ? '完了' : '未完'"></td>
                <td th:text="${#temporals.format(task.created_at, 'yyyy年M月d日 HH:mm')}"></td>
                <td th:text="${task.updated_at != null} ? ${#temporals.format(task.updated_at, 'yyyy年M月d日 HH:mm')} : '更新なし'"></td>
            </tr>
    </table>
    

    <!--追加入力欄-->
    <form class="row g-3" th:action="@{/add}" th:object="${todoForm}" method="post">
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        <input type="text" th:field="*{title}" placeholder="タスク名">
        <select class="form-select" aria-label="Default select example" name="completed" required>
            <option value="false">未完</option>
            <option value="true">完了</option>
        </select>
        <input type="hidden" th:field="*{created_at}">
        <button type="submit">追加する</button>
    </form>
    
    
    <!--編集画面に遷移-->
    <form class="row g-3" th:action="@{/edit}" method="get">
        <button type="submit">編集</button>
    </form>
    </div>
</body>
</html>
