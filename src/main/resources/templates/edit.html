    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script th:src="@{/js/app.js}" defer></script>
        <title>編集画面</title>
    </head>
    <body class="bg-light">
    <div class="container py-4" style="max-width: 900px;">
        <h1 class="h3 mb-4">編集画面</h1>

            <form th:action="@{/tasks/update}" th:object="${todoListForm}" method="post">
            <div class="card shadow-sm mb-3">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>タイトル</th>
                        <th class="text-center">状態</th>
                        <th>作成日</th>
                        <th>更新日</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="task, stat : ${tasks}">
                    
                        <input type="hidden" th:name="|todos[${stat.index}].id|" th:value="${task.id}"> 
                        <td class="text-center">
                            <div th:if="${#fields.hasErrors('todos[__${stat.index}__].title')}" th:errors="*{todos[__${stat.index}__].title}"></div>
                            <input class="form-control" type="text" th:name="|todos[${stat.index}].title|" th:value="${task.title}">
                        </td>
                        <td class="text-center">
                            <select class="form-select change-btn-design" th:classappend="${task.completed} ? 'text-bg-success' : 'text-bg-warning'" th:name="|todos[${stat.index}].completed|">
                                <option value="false" style="background-color: #ffffff; color: #000000;" th:selected="${!task.completed}">未完</option>
                                <option value="true" style="background-color: #ffffff; color: #000000;" th:selected="${task.completed}">完了</option>
                            </select>
                        </td>
                        <td class="text-nowrap" th:text="${#temporals.format(task.created_at, 'yyyy年M月d日 HH:mm')}"></td>
                        <td class="text-nowrap" th:text="${task.updated_at != null} ? ${#temporals.format(task.updated_at, 'yyyy年M月d日 HH:mm')} : '更新なし'"></td>
                        <td class="col-6 col-md-auto">
                            <button class="btn btn-danger w-100 delete-confirm" type="submit" th:formaction="@{/tasks/{id}/delete(id=${task.id})}" onclick="return checkConfirm()">削除する</button>
                        </td>
                    </tr>
                    </tbody>
                </table><br>
                </div>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-primary w-100" type="submit">更新する</button>
            </div>
        </form><br>

        <form th:action="@{/task}" method="get">
                <button class="btn btn-secondary" type="submit">戻る</button>
        </form>
    </div>
    </body>
    </html>
